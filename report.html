<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassPulse | Reports</title>
  <link rel="stylesheet" href="./style.css?v=3" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo">✅</div><span>ClassPulse</span></div>
      <nav>
        <a href="./dashboard.html"><span class="ico">📊</span><span class="lbl">Dashboard</span></a>
        <a href="./attendance.html"><span class="ico">✏️</span><span class="lbl">Mark Attendance</span></a>
        <a href="./report.html" class="active"><span class="ico">📈</span><span class="lbl">Reports</span></a>
        <a href="./students.html"><span class="ico">👥</span><span class="lbl">Students</span></a>
        <a href="./classes.html"><span class="ico">🏫</span><span class="lbl">Classes</span></a>
      </nav>
      <div class="user-box">
        <div class="who" id="user-name">—</div>
        <div class="mail" id="user-mail">—</div>
        <a href="#" class="btn btn-danger-ghost" style="width:100%;justify-content:flex-start;padding:9px 8px;font-size:13.5px;" id="logout-btn">↩ Logout</a>
      </div>
    </aside>

    <main class="main">
      <div id="class-bar"></div>

      <h1 class="page-title">Reports</h1>
      <p class="page-sub">Student-wise attendance, filters and export</p>

      <div class="section-head" style="flex-wrap:wrap">
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" id="tab-summary">📊 Summary</button>
          <button class="btn btn-outline" id="tab-daily">🗓 Daily View</button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-outline" id="export-csv">⬇ CSV</button>
          <button class="btn btn-outline" id="export-pdf">🖨 PDF / Print</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:22px">
        <div class="filters" id="summary-filters">
          <div class="field">
            <label>Month</label>
            <input type="month" class="input" id="f-month" style="width:180px" />
          </div>
          <div class="field">
            <label>From</label>
            <input type="date" class="input" id="f-from" style="width:160px" />
          </div>
          <div class="field">
            <label>To</label>
            <input type="date" class="input" id="f-to" style="width:160px" />
          </div>
          <div class="field" style="flex:1;min-width:140px">
            <label>Search roll number</label>
            <input type="number" class="input" id="f-search" min="1" max="180" placeholder="e.g. 42" />
          </div>
          <button class="btn btn-primary" id="apply-filters">Apply</button>
          <button class="btn btn-outline" id="all-time-btn">🕐 All Time</button>
        </div>
        <div style="font-size:12.5px;color:var(--text-muted);margin-top:10px">💡 Empty filters = <strong>All Time</strong> (total present / absent for each student). Use Month/From–To to filter by date range.</div>

        <div class="filters" id="daily-filters" style="display:none">
          <div class="field">
            <label>Date</label>
            <input type="date" class="input" id="f-date" style="width:180px" />
          </div>
          <button class="btn btn-primary" id="load-daily">Load Day</button>
          <div style="font-size:13px;color:var(--text-muted);align-self:center" id="daily-info"></div>
        </div>
      </div>

      <div class="print-title" id="print-title"></div>

      <div class="card">
        <div class="section-head">
          <h2 id="table-title">Student-wise Report</h2>
          <span style="font-size:13px;color:var(--text-muted)" id="table-meta"></span>
        </div>
        <div class="table-wrap">
          <table class="table" id="report-table">
            <thead id="report-thead"></thead>
            <tbody id="report-body">
              <tr><td><div class="skeleton" style="height:24px"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="./api.js?v=2"></script>
  <script src="./classbar.js?v=2"></script>
  <script src="./report.js?v=3"></script>
  <script src="./footer.js?v=2"></script>
</body>
</html>
