<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassPulse | Login</title>
  <link rel="stylesheet" href="./style.css?v=2" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">✅</div>
    <h1>ClassPulse</h1>
    <p class="sub" id="auth-sub">Sign in to your teacher account</p>

    <div class="auth-error" id="auth-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" placeholder="you@mdu.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="auth-btn">Sign In</button>
    </form>

    <p class="auth-switch">
      Don't have an account? <button type="button" id="switch-btn">Create account</button>
    </p>

    <div class="demo-hint">
      Demo account → <strong>teacher@demo.com</strong> / <strong>demo123</strong>
    </div>
  </div>

  <script src="./api.js?v=2"></script>
  <script src="./auth.js?v=2"></script>
</body>
</html>
